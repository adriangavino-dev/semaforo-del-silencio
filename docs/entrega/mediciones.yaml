# Datos del expediente que solo salen del prototipo físico.
#
# Rellena lo que deje de ser null y vuelve a generar:
#     python docs/entrega/generar_expediente.py
# Lo que siga en null sale en el PDF como "Sin dato" y se lista en PENDIENTES.md.
# Los datos de diseño pueden ser supuestos; los resultados de ensayos, nunca.

# true: versión para entregar, sin recuadros amarillos. false: resalta lo que falta.
cierre: true

equipo:
  nombre: "Semáforo del Silencio"
  integrantes:
    - {nombre: "Daniel David Vasquez Sayra", codigo: "PREMT01016"}
    - {nombre: "Daniel Matias Yarango Romero", codigo: "20261PREMT01201"}
    - {nombre: "Adrian Piero Gavino Navarrete", codigo: "202510483"}
    - {nombre: "Sebastian Alexander Balarezo Chihuan", codigo: "20261PREMT01124"}
    - {nombre: "Oscar Martin Anaya Casas", codigo: "20261PREMT01150"}

# Fuente definitiva de la unidad. bateria: true activa el protocolo de autonomía.
alimentacion:
  tipo: "cargador USB de 5 V, a través del módulo ELEGOO con interruptor"
  bateria: false

mecanico:
  material: "PLA"
  proceso: "Impresión 3D FDM"
  dimensiones_mm: "Caja 90,5 × 129,5 × 51,4; tapa 90,5 × 129,5 × 5,5"  # medido del 3MF
  masa_g: 1100
  holgura_mm: "0,0 nominal en CAD; sin medir en la pieza"
  fijacion: "Placa atornillada a la caja; tapa con labio de encastre de 3 mm"
  software_cad: "Fusion 360"
  # Exportados del CAD del equipo. Copiarlos a entrega_semana13/cad/
  archivos: {step: null, stl: "caja_final.stl, tapa_final.stl", dxf: "envolvente.dxf"}

electronico:
  tipo_placa: "Placa perforada de doble cara, soldada"
  software_pcb: "No aplica, sin ruteo de pistas"
  servo_modelo: "TowerPro MG90S"
  # Copiar a entrega_semana13/pcb/
  gerber: "No aplica, placa perforada"
  taladrado_nc: "No aplica, placa perforada"

logico:
  repositorio_url: "https://github.com/adriangavino-dev/semaforo-del-silencio"
  dashboard_url: "http://localhost:8000, en la laptop de la unidad"

# Precio unitario en soles. Los que traen "referencial" son de tienda: cámbialos
# por lo que pagaron. fabricante/precio en null salen como pendientes.
bom:
  - {item: "ESP32 DevKit (módulo WROOM-32, CP2102, USB-C)", espec: "Wi-Fi 2,4 GHz, 240 MHz", fabricante: "Desconocido", cantidad: 1, precio: 35.00, fuente: "referencial Naylamp"}
  - {item: "Micrófono I²S INMP441", espec: "MEMS digital, 3,3 V", fabricante: "Desconocido", cantidad: 1, precio: 20.00, fuente: "referencial Naylamp"}
  - {item: "Servomotor MG90S", espec: "Micro servo de engranajes metálicos, 5 V", fabricante: "TowerPro", cantidad: 1, precio: 25.00, fuente: "referencial Naylamp"}
  - {item: "Módulo de alimentación", espec: "Salidas 3,3 V y 5 V, con interruptor", fabricante: "ELEGOO", cantidad: 1, precio: 12.00, fuente: "estimado"}
  - {item: "LED verde / amarillo / rojo", espec: "THT 5 mm", fabricante: "Desconocido", cantidad: 3, precio: 0.40, fuente: "referencial Naylamp"}
  - {item: "Resistencia 220 Ω", espec: "1/4 W", fabricante: "Desconocido", cantidad: 3, precio: 0.10, fuente: "estimado"}
  - {item: "Cable USB de alimentación", espec: "USB-C, 1 m, 5 V", fabricante: "Desconocido", cantidad: 1, precio: 13.90, fuente: "referencial Falabella"}
  - {item: "Cargador USB de pared", espec: "5 V, 2 A", fabricante: "Desconocido", cantidad: 1, precio: 20.00, fuente: "estimado"}
  - {item: "Placa perforada", espec: "Doble cara", fabricante: "Desconocido", cantidad: 1, precio: 3.50, fuente: "estimado"}
  - {item: "Cable plano y conectores Dupont", espec: "Micrófono y servo", fabricante: "Desconocido", cantidad: 1, precio: 5.00, fuente: "estimado"}
  - {item: "Envolvente impresa en 3D", espec: "PLA azul, ≈ 176 g (142 cm³ del modelo)", fabricante: "Fabricación propia", cantidad: 1, precio: 15.00, fuente: "estimado, S/. 85 por kg"}
  - {item: "Tornillería", espec: "Fijación de la placa", fabricante: "Desconocido", cantidad: 1, precio: 3.00, fuente: "estimado"}

# Autonomía: medir con multímetro en serie con la salida de la batería, a 5 V.
autonomia:
  bateria_mah: null           # capacidad nominal
  bateria_v: null             # tensión nominal de la celda, p. ej. 3.7
  eficiencia: 0.85            # del convertidor a 5 V, si lo hay; cambiar si se conoce
  corriente_ma:               # corriente medida en cada estado
    muestreo: null            # unidad encendida, Wi-Fi conectado, sin audio
    transmision: null         # con run_session.py activo (audio por UDP)
    espera: null              # sin hotspot, reintentando conexión
  servo_giro_ma: null         # durante un giro
  horas_medidas: null         # tiempo real hasta que se apagó

# Se elige solo el último reports/burnin_*.json. Esto es para otro registro.
burnin:
  temperatura_ambiente_c: null

mvis:
  - {interfaz: "Mecánica ↔ Electrónica", criterio: "Placa fija sin flexión; 0 interferencias entre componentes y envolvente; puertos accesibles", evidencia: "Placa atornillada dentro de la caja y LED alineados en los agujeros de ø5 mm (fotos del 6/11). El micrófono sale por un cable plano externo, sin integrarse a la envolvente.", estado: "parcial"}
  - {interfaz: "Electrónica ↔ Software", criterio: "Pines del firmware iguales al cableado: autotest de LED 3/3, servo 3/3, micrófono con señal", evidencia: "Medido en banco por USB: LED 3/3, servo 3/3 (30°/90°/150°), micrófono 35 → 57 dB al hablar. Falta repetir en la unidad final por Wi-Fi.", estado: "parcial"}
  - {interfaz: "Electrónica ↔ Software (enlace)", criterio: "Telemetría ≥ 99 %; orden de color llega al LED en < 1 s por Wi-Fi", evidencia: "Placa real, Wi-Fi doméstico de -80 a -86 dBm. Prueba de 14 s: color en 64-78 ms, telemetría 14/14, audio 1,7 % perdido. Sesión de 18,6 min: 83,7 % de órdenes. Ensayo de 10 min: 68,1 % de órdenes y 29,25 % de audio perdido. No alcanza el criterio con esta señal; falta repetir con el hotspot cerca.", estado: "no cumple"}
  - {interfaz: "Mecánica ↔ Térmica", criterio: "Temperatura interna < 45 °C tras 2 h de operación continua", evidencia: "Sin medir: la unidad no tiene sensor interno y no se usó termómetro.", estado: "sin medir"}
  - {interfaz: "Usuario ↔ Sistema", criterio: "Encendido con un switch; color identificado por 10/10 personas a 8 m", evidencia: "Arranca con cargador USB de 5 V y el interruptor del módulo, sin PC, según prueba del equipo. La prueba de visibilidad a 8 m no se ejecutó.", estado: "parcial"}
  - {interfaz: "Usuario ↔ Tablero", criterio: "Estado interpretado en < 3 s sin explicación previa", evidencia: "El tablero mostró color, nivel y eventos en vivo durante la sesión. Sin prueba cronometrada con usuarios.", estado: "parcial"}

kpi:
  sonometro_contrastado: null   # true cuando se compare DB_OFFSET contra un sonómetro
  dif_sonometro_db: null        # diferencia máxima a 40, 55 y 65 dB; criterio ≤ 3
  # Números: medidos en aula real. Texto: datos de la prueba de banco, sin comparar con la norma.
  fondo_aula_vacia_db: "30 dB relativos; cuarto, no aula"
  nivel_clase_db: "30,1 dB relativos; prueba de banco"
  verde_pct: "80,3 % en prueba de banco"
  eventos_por_sesion: "17 en 18,6 min, prueba de banco"

# Texto de cada foto del panel. Ajústalo a lo que muestre la foto real.
pies_de_foto:
  "1.1": "Primera versión: LED y resistencias sobre placa perforada, con caja blanca de prueba."
  "1.2": "Unidad final en caja azul impresa en PLA, con el semáforo al frente y el micrófono por cable plano."
  "2.1": "Interior de la envolvente: placa atornillada a la caja, sin adhesivos ni cintas."
  "2.2": "LED del semáforo alineados en los agujeros de ø5 mm de la caja."
  "3.1": "Cableado interno sobre la placa perforada, con conectores para el micrófono y el servo."
  "3.2": "ESP32 montado en la placa, con su puerto USB-C alineado al borde de la caja."
  "4.1": "Módulo de alimentación ELEGOO con interruptor: la unidad arranca con cargador USB de 5 V, sin PC."
  "4.2": "Tablero en vivo durante la sesión del 6/11, en AMARILLO, junto a la unidad. Fotograma de video."
  "5.1": "Unidad levantada con una mano: bloque rígido, sin juego interno."
  "5.2": "Unidad operando sobre la mesa durante el ensayo Burn-in."
